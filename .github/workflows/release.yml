name: release

# Stable release flow. Triggered when commits land on main (typically from a
# release/* PR that bumped the VERSION file). Reads VERSION as the source of
# truth and tags v<VERSION>. Publishing to npm with Trusted Publishing and
# provenance, the prebuild artifacts and the GitHub Release are wired in
# task 3.3.
#
# Idempotent: if the tag already exists (i.e. main was pushed without a
# VERSION bump), the workflow exits cleanly without retagging or republishing.
on:
  push:
    branches: [main]

# Least privilege: the job declares what it needs.
permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # contents: write pushes the release tag.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Credentials stay persisted because the Push tag step pushes with them.
          persist-credentials: true  # zizmor: ignore[artipacked]

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # No dependency cache in publishing workflows (cache poisoning).
          package-manager-cache: false

      - run: npm ci

      - name: Read VERSION
        id: ver
        run: |
          set -euo pipefail
          v=$(tr -d '[:space:]' < VERSION)
          if [ -z "$v" ]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v"    >> "$GITHUB_OUTPUT"

      - name: Template-sentinel guard
        id: sentinel
        # VERSION starts at 0.0.0 on a fresh template clone. Don't try to
        # release a "v0.0.0" — it means "not actually released yet". The
        # first release/* branch bumps VERSION to 0.1.0.
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$VERSION" = "0.0.0" ]; then
            echo "VERSION=0.0.0 is the template sentinel; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Idempotence guard
        id: guard
        if: steps.sentinel.outputs.skip == 'false'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            # Tag exists. Only treat as "skip" if it points at HEAD or an
            # ancestor — a tag that points at an unrelated commit (e.g.
            # the template's initial commit) is a bootstrap-tag artifact
            # the user needs to delete, not a real prior release.
            tag_sha=$(git rev-parse "$TAG")
            if git merge-base --is-ancestor "$tag_sha" HEAD; then
              echo "Tag $TAG already exists at $tag_sha; skipping release."
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Tag $TAG exists at $tag_sha which is not an ancestor of HEAD. Delete the stale tag (\`git push origin :refs/tags/$TAG\`) and re-run."
              exit 1
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag
        if: steps.sentinel.outputs.skip == 'false' && steps.guard.outputs.exists == 'false'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
