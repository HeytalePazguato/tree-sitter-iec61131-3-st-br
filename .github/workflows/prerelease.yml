name: prerelease

# Two distinct flows live here:
#
#   develop    -> dev-build job: build snapshot artifacts, upload as workflow
#                 artifact stamped 0.0.<run_number>-dev (90d retention),
#                 trim to keep only the latest 3 dev artifacts.
#
#   release/*  -> prerelease job: derive base version from branch name,
#                 pick stage from commit-message keyword (default alpha,
#                 [beta], [rc]), auto-increment the per-stage counter,
#                 push the new tag, and trim old GitHub pre-releases.
#                 Publishing the -rc build to npm (dist-tag next) with
#                 Trusted Publishing is wired in task 3.3.
on:
  push:
    branches: [develop, "release/**"]

# Least privilege: every job declares what it needs.
permissions: {}

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions: write lets the trim step list and delete old workflow artifacts via the GitHub API.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # No dependency cache in publishing workflows (cache poisoning).
          package-manager-cache: false

      - run: npm ci

      - name: Compute dev version
        id: ver
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          v="0.0.${RUN_NUMBER}-dev"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v"     >> "$GITHUB_OUTPUT"

      # Snapshot artifacts (wasm and prebuilds) are produced by tasks 3.1 to 3.3; until then there is nothing to upload and the upload step tolerates that.
      - name: Upload dev artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.repository.name }}-${{ steps.ver.outputs.version }}
          path: |
            *.wasm
            prebuilds/**
          retention-days: 90
          if-no-files-found: ignore

      - name: Trim old dev artifacts (keep latest 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | contains("-dev")) | "\(.created_at)\t\(.id)"' \
            | sort -r \
            | awk -F'\t' 'NR>3 {print $2}' \
            | xargs -r -I{} gh api -X DELETE "repos/${REPO}/actions/artifacts/{}"

  prerelease:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      # contents: write pushes the prerelease tag and deletes old GitHub pre-releases.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Credentials stay persisted because the Push tag step pushes with them.
          persist-credentials: true  # zizmor: ignore[artipacked]

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # No dependency cache in publishing workflows (cache poisoning).
          package-manager-cache: false

      - run: npm ci

      - name: Compute prerelease tag
        id: tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          base="${REF#refs/heads/release/}"
          msg=$(git log -1 --pretty=%B)
          if echo "$msg" | grep -qE '\[rc\]'; then
            stage=rc
          elif echo "$msg" | grep -qE '\[beta\]'; then
            stage=beta
          else
            stage=alpha
          fi
          git fetch --tags --quiet
          existing=$(git tag --list "v${base}-${stage}.*" | wc -l | tr -d ' ')
          next=$((existing + 1))
          tag="v${base}-${stage}.${next}"
          {
            echo "base=$base"
            echo "stage=$stage"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Selected $tag"

      - name: Idempotence guard
        id: guard
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag
        if: steps.guard.outputs.exists == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Trim old prereleases (keep latest 5)
        if: steps.guard.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r tag; do
                [ -z "$tag" ] && continue
                gh release delete "$tag" --yes --cleanup-tag
              done
